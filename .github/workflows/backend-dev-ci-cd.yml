name: backend-dev-ci-cd

on:
  push:
    branches: [ prod ]

env:
  IMAGE: ghcr.io/b1ackc/backend-test

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - name: Edit Permission to gradlew
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Login registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build & push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: ./Dockerfile
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:dev

  cd:
    needs: ci
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Select target (dev)
        id: sel
        run: |
          echo "host=${{ secrets.DEV_HOST }}" >> $GITHUB_OUTPUT
          echo "user=${{ secrets.DEV_USER }}" >> $GITHUB_OUTPUT
          echo "password=${{ secrets.DEV_PASSWORD }}" >> $GITHUB_OUTPUT
          echo "compose=dev-docker-compose.yml" >> $GITHUB_OUTPUT
          echo "tag=dev" >> $GITHUB_OUTPUT
          echo "path=${{ secrets.DEV_APP_PATH }}" >> $GITHUB_OUTPUT

      - name: Upload compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.sel.outputs.host }}
          username: ${{ steps.sel.outputs.user }}
          password: ${{ steps.sel.outputs.password }}
          source: "deploy/${{ steps.sel.outputs.compose }}"
          target: "${{ steps.sel.outputs.path }}/"
          overwrite: false


      - name: Start colima & deploy with compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.sel.outputs.host }}
          username: ${{ steps.sel.outputs.user }}
          password: ${{ steps.sel.outputs.password }}
          script: |
              set -e
              export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
              colima status >/dev/null 2>&1 || colima start

              echo "1. ==== CHANGE DIR ===="
              cd /opt/app/deploy
              pwd && ls -al

              echo "2. ==== DOCKER LOGIN ===="
              docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

              echo "3. ==== DEPLOY START ===="
              export IMAGE_BACKEND=ghcr.io/b1ackc/backend-test:dev
              docker compose -f dev-docker-compose.yml pull
              docker compose -f dev-docker-compose.yml up -d --remove-orphans

              echo "4. ==== CLEANUP ===="
              docker image prune -f